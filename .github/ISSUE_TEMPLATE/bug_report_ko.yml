name: 한국어 패치 오류·호환성 제보
description: PS1·Switch·Steam macOS·Steam Windows의 문제를 제보합니다.
title: "[플랫폼 / 버전] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        게임 본체·ROM·BIOS·키·세이브 전체·개인정보가 든 로그는 공개 첨부하지 마세요.
  - type: dropdown
    id: platform
    attributes:
      label: 게임 플랫폼
      options:
        - PS1
        - Nintendo Switch
        - Steam macOS
        - Steam Windows
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: 사용한 패키지 파일명과 버전
      description: PS1 Windows Portable은 PS1 게임용 도구입니다.
    validations:
      required: true
  - type: textarea
    id: identity
    attributes:
      label: 원본 버전 및 패치 검사 결과
      description: Steam Build ID 또는 Switch 업데이트/Build ID, PS1 Rev와 SHA-256 등 확인한 결과를 적어 주세요.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: 운영체제·기기·에뮬레이터와 버전
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서·실제 결과·기대 결과
    validations:
      required: true
  - type: checkboxes
    id: legal
    attributes:
      label: 첨부물 확인
      options:
        - label: 게임 본체·ROM·BIOS·키·전체 세이브·개인정보를 첨부하지 않았습니다.
          required: true
