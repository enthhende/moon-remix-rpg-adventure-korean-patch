name: validate-public-release-source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit repository boundary
        run: python3 scripts/audit_public_repo.py
      - name: Run release-tool tests
        run: python3 -m unittest discover -s tests -v
